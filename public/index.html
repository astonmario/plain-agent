<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plain Agent - Web Interface</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 800px;
      height: 600px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
    }

    .message {
      margin-bottom: 16px;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-user {
      background: #667eea;
      color: white;
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 70%;
      margin-left: auto;
      word-wrap: break-word;
    }

    .message-agent {
      background: white;
      color: #333;
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 70%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      word-wrap: break-word;
    }

    .message-tool {
      background: #e3f2fd;
      color: #1565c0;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      max-width: 80%;
      margin-left: 20px;
      font-family: 'Courier New', monospace;
    }

    .message-thinking {
      color: #999;
      font-style: italic;
      font-size: 14px;
      margin-left: 20px;
    }

    .input-area {
      padding: 20px;
      background: white;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-area input:focus {
      border-color: #667eea;
    }

    .input-area button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .input-area button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .input-area button:active {
      transform: translateY(0);
    }

    .input-area button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      padding: 8px 16px;
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      margin-bottom: 16px;
      border-radius: 4px;
      font-size: 13px;
    }

    .error {
      background: #f8d7da;
      border-left-color: #dc3545;
      color: #721c24;
    }

    .iteration {
      color: #666;
      font-size: 12px;
      margin-bottom: 8px;
      padding-left: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 Plain Agent</h1>
      <p>基于 ReAct 的 AI Agent - Web 界面</p>
    </div>

    <div class="chat-area" id="chatArea"></div>

    <div class="input-area">
      <input
        type="text"
        id="taskInput"
        placeholder="输入任务，例如：读取当前目录的 package.json..."
        autofocus
      />
      <button id="submitBtn">发送</button>
    </div>
  </div>

  <script>
    const chatArea = document.getElementById('chatArea');
    const taskInput = document.getElementById('taskInput');
    const submitBtn = document.getElementById('submitBtn');

    let isProcessing = false;

    // 添加消息
    function addMessage(type, content) {
      const div = document.createElement('div');
      div.className = `message message-${type}`;
      div.textContent = content;
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // 添加状态消息
    function addStatus(message, isError = false) {
      const div = document.createElement('div');
      div.className = `status ${isError ? 'error' : ''}`;
      div.textContent = message;
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // 添加迭代标记
    function addIteration(index) {
      const div = document.createElement('div');
      div.className = 'iteration';
      div.textContent = `━━━ 迭代 ${index} ━━━`;
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // 处理事件
    function handleEvent(event) {
      switch (event.type) {
        case 'user':
          // 用户消息已经显示
          break;

        case 'iteration':
          addIteration(event.index);
          break;

        case 'thinking':
          addMessage('thinking', '💭 思考中...');
          break;

        case 'tool_start':
          addMessage('tool', `🔧 调用工具: ${event.tool}(${JSON.stringify(event.args)})`);
          break;

        case 'tool_result':
          const result = event.result.length > 200
            ? event.result.slice(0, 200) + '...'
            : event.result;
          addMessage('tool', `✅ 结果: ${result} (${event.duration}ms)`);
          break;

        case 'assistant':
          addMessage('agent', event.message);
          break;

        case 'done':
          addStatus('✅ 完成');
          break;

        case 'error':
          addStatus(`❌ 错误: ${event.error.message}`, true);
          break;

        case 'stopped':
          addStatus('⏹️ 已停止');
          break;
      }
    }

    // 提交任务
    async function submitTask() {
      const task = taskInput.value.trim();
      if (!task || isProcessing) return;

      isProcessing = true;
      submitBtn.disabled = true;
      submitBtn.textContent = '执行中...';

      // 显示用户消息
      addMessage('user', task);
      taskInput.value = '';

      try {
        const response = await fetch('http://127.0.0.1:3000/api/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ task }),
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          let newlineIndex;
          while ((newlineIndex = buffer.indexOf('\n')) !== -1) {
            const line = buffer.slice(0, newlineIndex).trim();
            buffer = buffer.slice(newlineIndex + 1);

            if (!line.startsWith('data:')) continue;

            const payload = line.slice(5).trim();
            if (payload === '[DONE]') {
              isProcessing = false;
              submitBtn.disabled = false;
              submitBtn.textContent = '发送';
              return;
            }

            try {
              const event = JSON.parse(payload);
              handleEvent(event);
            } catch (e) {
              console.error('Failed to parse event:', e);
            }
          }
        }
      } catch (error) {
        addStatus(`❌ 请求失败: ${error.message}`, true);
      } finally {
        isProcessing = false;
        submitBtn.disabled = false;
        submitBtn.textContent = '发送';
      }
    }

    // 事件监听
    submitBtn.addEventListener('click', submitTask);
    taskInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !isProcessing) {
        submitTask();
      }
    });

    // 初始化
    addStatus('🚀 已连接到 Plain Agent Server');
  </script>
</body>
</html>
